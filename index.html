function render(){
  const tp=$("topic").value, rl=$("rel").value, q=$("q").value.trim().toLowerCase();
  const fo=$("figonly").checked;
  const rows=D.filter(r=>(!fo||FIGS.has(r[7]))&&(!tp||r[0]==tp)&&(!rl||r[2]===rl)&&(!q||(r[1]+r[3]+r[4]+r[5]).toLowerCase().includes(q)));
  $("count").textContent=rows.length+" 件";
  let html="",cur=null;
  rows.forEach(r=>{
    if(r[0]!==cur){ if(cur!==null) html+="</section>"; cur=r[0];
      const part=PARTS[r[0]]?`<span class="part">${PARTS[r[0]]}</span>`:"";
      html+=`<section><h2><span class="no">${r[0]}</span>${esc(r[1])}${part}</h2>`; }
    const ov=esc(r[5]).replace(/(※.*)$/,'<span class="note">$1</span>');
    html+=`<div class="card"><div class="top"><span class="badge b-${r[2]}">${r[2]}</span><div>
      <div class="title"><a href="https://youtu.be/${r[7]}" target="_blank" rel="noopener">${esc(r[3])}</a></div>
      <span class="theme">${esc(r[4])}</span><p class="ov">${ov}</p>
      ${FIGS.has(r[7])?`<button class="figbtn" type="button" data-id="${r[7]}" aria-expanded="false">▶ インフォグラフィックを表示</button><div class="figbox" hidden><button class="fig" type="button" data-id="${r[7]}" data-cap="${esc(r[4])}" aria-label="図解を拡大"><img data-src="img/${r[7]}.png" alt="${esc(r[4])}の図解"></button><div class="note">クリックで拡大</div></div>`:""}

  });
  if(cur!==null) html+="</section>";
  $("list").innerHTML=html||'<p class="note" style="margin-top:24px">該当する動画はありません。</p>';
}
["topic","rel","q","figonly"].forEach(id=>$(id).addEventListener("input",render));
